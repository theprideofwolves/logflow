name: Test and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - run: go vet ./...
      - run: go test -race -count=1 '-coverprofile=coverage.out' ./...
      - run: go build -trimpath -o dist/logflow${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/logflow
      - name: Packaged workflow smoke test
        run: python .github/scripts/smoke.py dist/logflow${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Record synthetic benchmark samples
        run: |
          go test ./internal/analysis -run '^$' -bench '^BenchmarkProcess$' -benchmem -benchtime=3x -count=3 | Tee-Object -FilePath benchmarks.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: runner.os == 'Windows'
      - name: Record synthetic benchmark samples (Linux)
        run: go test ./internal/analysis -run '^$' -bench '^BenchmarkProcess$' -benchmem -benchtime=3x -count=3 | tee benchmarks.txt
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: logflow-${{ runner.os }}
          path: |
            dist/
            coverage.out
            benchmarks.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Package portable releases
        run: |
          mkdir -p release
          for os in windows linux; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "package-$os"
            GOOS=$os GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "package-$os/logflow$ext" ./cmd/logflow
            go version -m "package-$os/logflow$ext" > "package-$os/dependencies.txt"
            cp README.md TESTING.md RELEASE.md architecture.md interviewprep.md explaining-each-decision-taken-over-others.md "package-$os/"
            cp -r docs "package-$os/"
            (cd "package-$os" && zip -r "../release/logflow-$os-x64.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "LogFlow $tag" --notes-file RELEASE.md
